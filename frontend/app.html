<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notaría 33 de Bogotá · Asistente Notarial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #F7F6F2;
        color: #1C1917;
        margin: 0;
        -webkit-font-smoothing: antialiased;
      }
      .serif-editorial {
        font-family: 'Playfair Display', Georgia, serif;
      }
      .mono-data {
        font-family: 'JetBrains Mono', monospace;
      }
      /* Estilo de barra de desplazamiento sutil Loft */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #D6D3CD;
        border-radius: 9999px;
      }
    </style>
  </head>
  <body class="bg-[#F7F6F2] text-[#1C1917]">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      function App() {
        // Todos los Hooks declarados al inicio (Prevención Error #310)
        const [data, setData] = useState(null);
        const [loading, setLoading] = useState(true);
        const [vistaActiva, setVistaActiva] = useState('ASISTENTE'); // 'ASISTENTE' | 'CONFIGURACION'
        const [hojaDerecha, setHojaDerecha] = useState('ESTADO'); // 'ESTADO' | 'LINDEROS' | 'ESCRITURA'
        const [tabConfig, setTabConfig] = useState('TRAMITES'); // 'TRAMITES' | 'DOCUMENTOS' | 'CATEGORIAS' | 'PROYECTOS'

        // Estados de interacción del Asistente
        const [mensajeInput, setMensajeInput] = useState('');
        const [fechaPazYSalvo, setFechaPazYSalvo] = useState('2026-11-25');
        const [hojasPapel, setHojasPapel] = useState('AA-4910201 a AA-4910206');
        const [numEscritura, setNumEscritura] = useState('3.418 de 2026');
        const [notificacion, setNotificacion] = useState('');

        // Estados de Configuración -> 1. Nuevo Trámite
        const [nuevoTramiteNombre, setNuevoTramiteNombre] = useState('');
        const [nuevoTramitePlantilla, setNuevoTramitePlantilla] = useState('VENTA PH.docx');
        const [reqDocs, setReqDocs] = useState(true);
        const [reqLinderos, setReqLinderos] = useState(true);
        const [reqAbogado, setReqAbogado] = useState(true);
        const [reqCliente, setReqCliente] = useState(true);

        // Estados de Configuración -> 2. Nuevo Documento y Vigencia
        const [tramiteIdxSelec, setTramiteIdxSelec] = useState(0);
        const [nuevoDocNombre, setNuevoDocNombre] = useState('');
        const [nuevoDocRegla, setNuevoDocRegla] = useState('FIN_DE_MES_ACTUAL');
        const [nuevoDocCampos, setNuevoDocCampos] = useState('');
        const [nuevoDocDesc, setNuevoDocDesc] = useState('');

        // Estados de Configuración -> 3. Nueva Categoría
        const [nuevaCatNombre, setNuevaCatNombre] = useState('');
        const [nuevaCatPregunta, setNuevaCatPregunta] = useState('');
        const [nuevaCatDocExtra, setNuevaCatDocExtra] = useState('');
        const [nuevaCatClausula, setNuevaCatClausula] = useState('');

        // Estados de Configuración -> 4. Proyectos de Constructoras
        const [proyectoIdx, setProyectoIdx] = useState(0);
        const [unidadSeleccionada, setUnidadSeleccionada] = useState(null);
        const [nuevoProyNombre, setNuevoProyNombre] = useState('');
        const [nuevoProyConstructora, setNuevoProyConstructora] = useState('');
        const [nuevoProyNit, setNuevoProyNit] = useState('');
        const [nuevoProyBloques, setNuevoProyBloques] = useState(3);
        const [nuevoProyAptos, setNuevoProyAptos] = useState(6);

        const chatEndRef = useRef(null);

        const mostrarAviso = (txt) => {
          setNotificacion(txt);
          setTimeout(() => setNotificacion(''), 3500);
        };

        const cargarEstado = async () => {
          try {
            const res = await fetch('/api/state');
            const json = await res.json();
            setData(json);
            if (json.casos?.[0]?.aprobaciones) {
              setHojasPapel(json.casos[0].aprobaciones.hojas_papel_notarial || 'AA-4910201 a AA-4910206');
              setNumEscritura(json.casos[0].aprobaciones.numero_escritura_asignada || '3.418 de 2026');
            }
          } catch (e) {
            console.error(e);
          } finally {
            setLoading(false);
          }
        };

        useEffect(() => {
          cargarEstado();
        }, []);

        useEffect(() => {
          if (chatEndRef.current) {
            chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
          }
        }, [data?.casos?.[0]?.mensajes_chat?.length]);

        const enviarInteraccionAgente = async (payload = {}) => {
          await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          setMensajeInput('');
          await cargarEstado();
        };

        const aprobarLindero = async (lindero_id, valor_aprobado, aprobar_todos = false) => {
          await fetch('/api/linderos/aprobar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lindero_id, valor_aprobado, aprobar_todos })
          });
          await cargarEstado();
          if (aprobar_todos) {
            setHojaDerecha('ESTADO');
            mostrarAviso('Linderos confirmados e integrados en el borrador.');
          }
        };

        const avanzarFlujo = async (paso) => {
          await fetch('/api/flujo/avanzar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              paso,
              hojas_papel_notarial: hojasPapel,
              numero_escritura: numEscritura
            })
          });
          await cargarEstado();
        };

        const reiniciarCaso = async () => {
          await fetch('/api/caso/reiniciar', { method: 'POST' });
          setHojaDerecha('ESTADO');
          await cargarEstado();
          mostrarAviso('Caso reiniciado al estado inicial de recepción.');
        };

        // Manejador único para los botones de acción dentro de los mensajes del Agente
        const ejecutarAccionBotonChat = async (tipo) => {
          if (tipo === 'SUBIR_CEDULA_MONICA') {
            await enviarInteraccionAgente({
              subir_cedula_monica: true,
              mensaje: 'Adjunto la Cédula de Ciudadanía de la vendedora Mónica Patricia Pérez Gómez (C.C. 52.110.900).'
            });
            setHojaDerecha('ESTADO');
            mostrarAviso('Cédula de Mónica Pérez verificada y agregada al trámite.');
          } else if (tipo === 'ABRIR_LINDEROS') {
            setHojaDerecha('LINDEROS');
          } else if (tipo === 'APROBAR_ABOGADO') {
            await avanzarFlujo('VISTO_BUENO_ABOGADO');
            setHojaDerecha('ESTADO');
            mostrarAviso('Aprobación jurídica del abogado registrada.');
          } else if (tipo === 'APROBAR_CLIENTES') {
            await avanzarFlujo('VISTO_BUENO_CLIENTES');
            setHojaDerecha('ESTADO');
            mostrarAviso('Conformidad y visto bueno de clientes confirmados.');
          } else if (tipo === 'IMPRIMIR_ESCRITURA') {
            await avanzarFlujo('ENVIAR_A_IMPRESION');
            setHojaDerecha('ESCRITURA');
            mostrarAviso('Escritura enviada a impresión con asignación de papel notarial.');
          } else if (tipo === 'VER_ESCRITURA') {
            setHojaDerecha('ESCRITURA');
          } else if (tipo === 'VER_DOCUMENTOS') {
            setHojaDerecha('ESTADO');
          }
        };

        // Funciones de Configuración
        const guardarNuevoTramite = async (e) => {
          e.preventDefault();
          if (!nuevoTramiteNombre.trim()) return;
          await fetch('/api/nosql/tramite', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              nombre: nuevoTramiteNombre,
              plantilla_base: nuevoTramitePlantilla,
              flujo_aprobacion: {
                exige_documentos_vigentes: reqDocs,
                exige_revision_linderos: reqLinderos,
                exige_aprobacion_abogado: reqAbogado,
                exige_aprobacion_cliente: reqCliente,
                exige_impresion_papel_notarial: true
              }
            })
          });
          setNuevoTramiteNombre('');
          setTramiteIdxSelec(0);
          await cargarEstado();
          mostrarAviso('Nuevo trámite y flujo de aprobación guardados.');
        };

        const guardarNuevoDocumento = async (e) => {
          e.preventDefault();
          if (!nuevoDocNombre.trim()) return;
          await fetch('/api/nosql/documento-regla', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              tramite_idx: tramiteIdxSelec,
              codigo: nuevoDocNombre.toUpperCase().replace(/\s+/g, '_'),
              nombre: nuevoDocNombre,
              regla_vencimiento: nuevoDocRegla,
              campos_extraer: nuevoDocCampos
                ? nuevoDocCampos.split(',').map((s) => s.trim())
                : ['Fecha de expedición', 'Titular'],
              descripcion_regla: nuevoDocDesc || 'Regla de verificación configurada por la notaría.'
            })
          });
          setNuevoDocNombre('');
          setNuevoDocCampos('');
          setNuevoDocDesc('');
          await cargarEstado();
          mostrarAviso('Documento y regla de vigencia agregados al trámite.');
        };

        const guardarNuevaCategoria = async (e) => {
          e.preventDefault();
          if (!nuevaCatNombre.trim()) return;
          await fetch('/api/nosql/categoria', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              tramite_idx: tramiteIdxSelec,
              categoria_id: nuevaCatNombre.toUpperCase().replace(/\s+/g, '_'),
              nombre: nuevaCatNombre,
              pregunta_agente: nuevaCatPregunta || '¿Aplica esta condición al trámite?',
              documentos_adicionales: nuevaCatDocExtra ? [nuevaCatDocExtra] : [],
              clausulas_afectadas: [nuevaCatClausula || 'Cláusula especial del acto'],
              impacto_minuta: nuevaCatClausula || 'Ajusta el texto de la minuta según la condición.'
            })
          });
          setNuevaCatNombre('');
          setNuevaCatPregunta('');
          setNuevaCatDocExtra('');
          setNuevaCatClausula('');
          await cargarEstado();
          mostrarAviso('Categoría agregada al trámite.');
        };

        const crearProyectoConstructora = async (e) => {
          e.preventDefault();
          if (!nuevoProyNombre.trim()) return;
          await fetch('/api/constructoras/crear-proyecto', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              nombre_proyecto: nuevoProyNombre,
              constructora: nuevoProyConstructora || 'Constructora Aliada S.A.',
              nit: nuevoProyNit || '900.412.889-1',
              num_bloques: Number(nuevoProyBloques || 3),
              aptos_por_bloque: Number(nuevoProyAptos || 6)
            })
          });
          setNuevoProyNombre('');
          setNuevoProyConstructora('');
          setNuevoProyNit('');
          setProyectoIdx(0);
          await cargarEstado();
          mostrarAviso('Proyecto inmobiliario creado con sus bloques y apartamentos.');
        };

        const cambiarEstadoUnidad = async (proyecto_id, unidad_id, nuevo_estado) => {
          await fetch('/api/constructoras/actualizar-unidad', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ proyecto_id, unidad_id, nuevo_estado })
          });
          await cargarEstado();
          mostrarAviso(`Unidad ${unidad_id} actualizada a "${nuevo_estado}".`);
        };

        if (loading || !data) {
          return (
            <div className="min-h-screen flex items-center justify-center bg-[#F7F6F2] text-[#1C1917]">
              <div className="text-center space-y-2">
                <p className="serif-editorial text-xl">Notaría 33 de Bogotá</p>
                <p className="text-xs text-[#78716C]">Cargando asistente y trámites...</p>
              </div>
            </div>
          );
        }

        const caso = data.casos[0];
        const tramiteConfig = data.catalogo_tramites[tramiteIdxSelec] || data.catalogo_tramites[0];
        const proyecto = data.proyectos_constructoras[proyectoIdx] || data.proyectos_constructoras[0];
        const liq = data.liquidacion_actual;
        const estadoBpmn = data.estado_bpmn || {
          paso_actual_numero: 1,
          docs_completos: false,
          linderos_listos: false,
          dudas_linderos_pendientes: 2,
          abogado_aprobo: false,
          cliente_aprobo: false,
          impreso: false,
          siguiente_accion: { tipo: 'SUBIR_CEDULA_MONICA', etiqueta: 'Adjuntar Cédula Faltante' }
        };

        const pasosBpmn = [
          { num: 1, titulo: '1. Documentos y Vigencias', listo: estadoBpmn.docs_completos },
          { num: 2, titulo: '2. Linderos Verificados', listo: estadoBpmn.linderos_listos },
          { num: 3, titulo: '3. Aprobación Abogado', listo: estadoBpmn.abogado_aprobo },
          { num: 4, titulo: '4. Aprobación Cliente', listo: estadoBpmn.cliente_aprobo },
          { num: 5, titulo: '5. Impresión en Papel', listo: estadoBpmn.impreso }
        ];

        const traducirVigencia = (codigoRegla) => {
          if (codigoRegla === 'FIN_DE_MES_ACTUAL') return 'Vence el último día del mes en curso (Alerta a 5 días)';
          if (codigoRegla === 'MAX_30_DIAS') return 'Máximo 30 días desde expedición';
          if (codigoRegla === 'MAX_90_DIAS') return 'Máximo 90 días (3 meses)';
          return 'Permanente · Sin vencimiento';
        };

        return (
          <div className="min-h-screen flex flex-col bg-[#F7F6F2] text-[#1C1917]">
            {/* BARRA SUPERIOR MINIMALISTA ESTILO LOFT (Solo 2 Áreas: Asistente Notarial y Configuración) */}
            <header className="h-16 bg-[#F7F6F2] border-b border-[#E6E4DD] px-6 flex items-center justify-between sticky top-0 z-30">
              <div className="flex items-center gap-4">
                <div className="w-8 h-8 rounded-lg bg-[#1C1917] text-white flex items-center justify-center serif-editorial font-semibold text-sm">
                  N33
                </div>
                <div>
                  <div className="flex items-center gap-2.5">
                    <h1 className="serif-editorial text-base font-semibold text-[#1C1917]">
                      Notaría 33 de Bogotá
                    </h1>
                    <span className="text-xs text-[#78716C]">·</span>
                    <span className="text-xs text-[#78716C] mono-data">{caso.radicado}</span>
                  </div>
                  <p className="text-xs text-[#78716C]">{caso.inmueble.direccion}</p>
                </div>
              </div>

              {notificacion && (
                <div className="px-3.5 py-1.5 rounded-lg bg-[#1C1917] text-white text-xs font-medium">
                  {notificacion}
                </div>
              )}

              {/* NAVEGACIÓN DE 2 BOTONES LIMPIOS */}
              <div className="flex items-center gap-2 bg-[#F0EFEA] p-1 rounded-xl border border-[#E6E4DD]">
                <button
                  onClick={() => setVistaActiva('ASISTENTE')}
                  className={`px-4 py-1.5 rounded-lg text-xs font-medium transition ${
                    vistaActiva === 'ASISTENTE'
                      ? 'bg-[#1C1917] text-white shadow-sm'
                      : 'text-[#78716C] hover:text-[#1C1917]'
                  }`}
                >
                  Asistente del Trámite
                </button>
                <button
                  onClick={() => setVistaActiva('CONFIGURACION')}
                  className={`px-4 py-1.5 rounded-lg text-xs font-medium transition ${
                    vistaActiva === 'CONFIGURACION'
                      ? 'bg-[#1C1917] text-white shadow-sm'
                      : 'text-[#78716C] hover:text-[#1C1917]'
                  }`}
                >
                  Configuración (Trámites y Proyectos)
                </button>
              </div>
            </header>

            {/* =====================================================================
                ÁREA 1: ASISTENTE DEL TRÁMITE (INTERACCIÓN GUIADA DESDE EL AGENTE)
               ===================================================================== */}
            {vistaActiva === 'ASISTENTE' && (
              <main className="flex-1 max-w-[1440px] w-full mx-auto px-6 py-5 grid grid-cols-1 lg:grid-cols-12 gap-6">
                {/* COLUMNA IZQUIERDA (5 cols): EL AGENTE CONVERSACIONAL CON BOTONES DE ACCIÓN */}
                <section className="lg:col-span-5 bg-white rounded-xl border border-[#E6E4DD] flex flex-col h-[calc(100vh-110px)]">
                  {/* Cabecera sobria del Chat */}
                  <div className="px-5 py-4 border-b border-[#E6E4DD] flex items-center justify-between">
                    <div>
                      <h2 className="text-sm font-semibold text-[#1C1917]">Asistente Notarial</h2>
                      <p className="text-xs text-[#78716C]">
                        Te guía paso a paso y habilita las aprobaciones del trámite
                      </p>
                    </div>
                    <button
                      onClick={reiniciarCaso}
                      className="text-[11px] text-[#78716C] hover:text-[#1C1917] border border-[#E6E4DD] px-2.5 py-1 rounded-lg"
                      title="Volver al inicio del caso para probar el flujo completo"
                    >
                      Reiniciar caso
                    </button>
                  </div>

                  {/* Lista de Mensajes con Botones de Acción Directa */}
                  <div className="flex-1 overflow-y-auto p-5 space-y-4">
                    {caso.mensajes_chat.map((m) => (
                      <div
                        key={m.id}
                        className={`flex flex-col ${
                          m.emisor === 'ABOGADO' ? 'items-end' : 'items-start'
                        }`}
                      >
                        <div
                          className={`max-w-[94%] rounded-xl p-4 text-xs leading-relaxed ${
                            m.emisor === 'ABOGADO'
                              ? 'bg-[#F0EFEA] text-[#1C1917] border border-[#E6E4DD]'
                              : 'bg-white text-[#1C1917] border border-[#E6E4DD]'
                          }`}
                        >
                          <div className="flex items-center justify-between gap-4 mb-1.5 text-[11px] text-[#78716C]">
                            <span className="font-medium text-[#1C1917]">{m.autor}</span>
                            <span className="mono-data">{m.hora}</span>
                          </div>
                          <p className="text-xs text-[#1C1917]">{m.texto}</p>

                          {/* Puntos verificados (lista editorial limpia) */}
                          {m.hallazgos && m.hallazgos.length > 0 && (
                            <ul className="mt-3 pt-2.5 border-t border-[#E6E4DD] space-y-1 text-[11px] text-[#78716C]">
                              {m.hallazgos.map((h, i) => (
                                <li key={i} className="flex items-start gap-2">
                                  <span className="text-[#15803D] font-bold">✓</span>
                                  <span>{h}</span>
                                </li>
                              ))}
                            </ul>
                          )}

                          {/* Alertas o documentos pendientes (en terracota sobrio) */}
                          {m.alertas_rojas && m.alertas_rojas.length > 0 && (
                            <div className="mt-3 p-3 rounded-lg bg-[#FEF3C7]/45 border border-[#FDE68A] space-y-1.5 text-[11px] text-[#B45309]">
                              <div className="font-semibold">Pendientes por resolver en este trámite:</div>
                              {m.alertas_rojas.map((a, i) => (
                                <div key={i} className="flex items-start gap-1.5">
                                  <span>•</span>
                                  <span>{a}</span>
                                </div>
                              ))}
                            </div>
                          )}

                          {/* BOTONES DE ACCIÓN DIRECTA DENTRO DEL CHAT */}
                          {m.acciones_sugeridas && m.acciones_sugeridas.length > 0 && (
                            <div className="mt-3.5 pt-3 border-t border-[#E6E4DD] flex flex-wrap gap-2">
                              {m.acciones_sugeridas.map((acc, idx) => (
                                <button
                                  key={idx}
                                  onClick={() => ejecutarAccionBotonChat(acc.tipo)}
                                  className={`px-3.5 py-2 rounded-lg text-xs font-medium transition ${
                                    idx === 0
                                      ? 'bg-[#1C1917] text-white hover:bg-black/85'
                                      : 'bg-[#F7F6F2] text-[#1C1917] border border-[#E6E4DD] hover:bg-[#F0EFEA]'
                                  }`}
                                >
                                  {acc.etiqueta} →
                                </button>
                              ))}
                            </div>
                          )}
                        </div>
                      </div>
                    ))}
                    <div ref={chatEndRef} />
                  </div>

                  {/* Chips sutiles de prueba rápida + Entrada de mensaje */}
                  <div className="p-4 border-t border-[#E6E4DD] bg-[#FAF9F6] space-y-2.5">
                    <div className="flex flex-wrap items-center gap-1.5">
                      <button
                        onClick={() => ejecutarAccionBotonChat(estadoBpmn.siguiente_accion.tipo)}
                        className="px-2.5 py-1 rounded-md bg-[#1C1917] text-white text-[11px] font-medium"
                      >
                        Siguiente paso: {estadoBpmn.siguiente_accion.etiqueta}
                      </button>
                      <button
                        onClick={() =>
                          enviarInteraccionAgente({
                            activar_hipoteca: !caso.tiene_prenda_hipoteca,
                            mensaje: !caso.tiene_prenda_hipoteca
                              ? 'El inmueble se paga con crédito hipotecario.'
                              : 'El pago será de contado sin hipoteca.'
                          })
                        }
                        className="px-2.5 py-1 rounded-md bg-white border border-[#E6E4DD] text-[11px] text-[#78716C] hover:text-[#1C1917]"
                      >
                        {caso.tiene_prenda_hipoteca ? 'Con Hipoteca (Cambiar a Contado)' : 'Contado (Cambiar a Hipoteca)'}
                      </button>
                      <div className="flex items-center gap-1 bg-white border border-[#E6E4DD] rounded-md px-2 py-0.5 text-[11px] text-[#78716C]">
                        <span>Fecha Paz y Salvo:</span>
                        <input
                          type="date"
                          value={fechaPazYSalvo}
                          onChange={(e) => {
                            setFechaPazYSalvo(e.target.value);
                            enviarInteraccionAgente({
                              fecha_paz_y_salvo: e.target.value,

                        <label className="text-xs text-[#78716C]">Plantilla Base de Minuta (.docx)</label>
                        <input
                          type="text"
                          value={nuevoTramitePlantilla}
                          onChange={(e) => setNuevoTramitePlantilla(e.target.value)}
                          placeholder="Ej: VENTA PH.docx"
                          className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                        />
                      </div>
                      <div className="space-y-2 pt-2 border-t border-[#E6E4DD]">
                        <div className="text-xs font-medium text-[#1C1917]">
                          Aprobaciones exigidas para este trámite:
                        </div>
                        <label className="flex items-center gap-2 text-xs text-[#78716C]">
                          <input type="checkbox" checked={reqDocs} onChange={(e) => setReqDocs(e.target.checked)} />
                          Exigir todos los documentos completos y vigentes
                        </label>
                        <label className="flex items-center gap-2 text-xs text-[#78716C]">
                          <input type="checkbox" checked={reqLinderos} onChange={(e) => setReqLinderos(e.target.checked)} />
                          Exigir verificación de linderos por el abogado si hay sellos
                        </label>
                        <label className="flex items-center gap-2 text-xs text-[#78716C]">
                          <input type="checkbox" checked={reqAbogado} onChange={(e) => setReqAbogado(e.target.checked)} />
                          Exigir visto bueno jurídico del abogado
                        </label>
                        <label className="flex items-center gap-2 text-xs text-[#78716C]">
                          <input type="checkbox" checked={reqCliente} onChange={(e) => setReqCliente(e.target.checked)} />
                          Exigir visto bueno digital de los clientes antes de imprimir
                        </label>
                      </div>
                      <button
                        type="submit"
                        className="w-full py-2.5 rounded-lg bg-[#1C1917] text-white text-xs font-medium hover:bg-black/85"
                      >
                        Guardar Trámite
                      </button>
                    </form>

                    <div className="lg:col-span-7 space-y-3">
                      <h3 className="text-xs font-semibold uppercase tracking-wider text-[#78716C]">
                        Trámites Configurados en la Notaría
                      </h3>
                      {data.catalogo_tramites.map((t, idx) => (
                        <div
                          key={t.tramite_id}
                          onClick={() => setTramiteIdxSelec(idx)}
                          className={`p-5 rounded-xl border transition cursor-pointer bg-white ${
                            tramiteIdxSelec === idx ? 'border-[#1C1917]' : 'border-[#E6E4DD]'
                          }`}
                        >
                          <div className="flex items-center justify-between">
                            <div>
                              <h4 className="text-sm font-semibold text-[#1C1917]">{t.nombre}</h4>
                              <p className="text-xs text-[#78716C]">Plantilla: {t.plantilla_base}</p>
                            </div>
                            <span className="text-xs text-[#78716C]">
                              {t.documentos_reglas.length} documentos · {t.categorias.length} categorías
                            </span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* SUB-PESTAÑA 2: DOCUMENTOS REQUERIDOS, VIGENCIAS Y DATOS A EXTRAER */}
                {tabConfig === 'DOCUMENTOS' && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <form
                      onSubmit={guardarNuevoDocumento}
                      className="lg:col-span-5 bg-white p-6 rounded-xl border border-[#E6E4DD] space-y-4 h-fit"
                    >
                      <h3 className="serif-editorial text-base font-semibold text-[#1C1917]">
                        Agregar Documento al Trámite
                      </h3>
                      <div className="space-y-1">
                        <label className="text-xs text-[#78716C]">Nombre del Documento</label>
                        <input
                          type="text"
                          value={nuevoDocNombre}
                          onChange={(e) => setNuevoDocNombre(e.target.value)}
                          placeholder="Ej: Paz y Salvo de Valorización / Poder Especial"
                          className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                        />
                      </div>
                      <div className="space-y-1">
                        <label className="text-xs text-[#78716C]">Regla de Vencimiento</label>
                        <select
                          value={nuevoDocRegla}
                          onChange={(e) => setNuevoDocRegla(e.target.value)}
                          className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs bg-white"
                        >
                          <option value="FIN_DE_MES_ACTUAL">Vence el último día del mes (Alerta a 5 días)</option>
                          <option value="MAX_30_DIAS">Vigencia máxima de 30 días</option>
                          <option value="MAX_90_DIAS">Vigencia máxima de 90 días (3 meses)</option>
                          <option value="SIN_VENCIMIENTO">Permanente · Sin vencimiento (Ej: Cédula)</option>
                        </select>
                      </div>
                      <div className="space-y-1">
                        <label className="text-xs text-[#78716C]">Datos que el Asistente debe extraer (separados por coma)</label>
                        <input
                          type="text"
                          value={nuevoDocCampos}
                          onChange={(e) => setNuevoDocCampos(e.target.value)}
                          placeholder="Ej: Nombre, Número de cédula, Fecha de expedición"
                          className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                        />
                      </div>
                      <div className="space-y-1">
                        <label className="text-xs text-[#78716C]">Instrucción para el Asistente</label>
                        <input
                          type="text"
                          value={nuevoDocDesc}
                          onChange={(e) => setNuevoDocDesc(e.target.value)}
                          placeholder="Ej: Verificar que corresponda al mes de la firma"
                          className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                        />
                      </div>
                      <button
                        type="submit"
                        className="w-full py-2.5 rounded-lg bg-[#1C1917] text-white text-xs font-medium hover:bg-black/85"
                      >
                        Agregar Documento
                      </button>
                    </form>

                    <div className="lg:col-span-7 space-y-3">
                      <h3 className="text-xs font-semibold uppercase tracking-wider text-[#78716C]">
                        Documentos y Vigencias de: {tramiteConfig.nombre}
                      </h3>
                      {tramiteConfig.documentos_reglas.map((doc) => (
                        <div key={doc.codigo} className="p-5 rounded-xl border border-[#E6E4DD] bg-white space-y-2">
                          <div className="flex items-center justify-between">
                            <h4 className="text-sm font-semibold text-[#1C1917]">{doc.nombre}</h4>
                            <span className="px-2.5 py-0.5 rounded bg-[#F7F6F2] border border-[#E6E4DD] text-[11px] text-[#1C1917]">
                              {traducirVigencia(doc.regla_vencimiento)}
                            </span>
                          </div>
                          <p className="text-xs text-[#78716C]">{doc.descripcion_regla}</p>
                          <div className="text-[11px] text-[#78716C] pt-1">
                            <span className="font-medium text-[#1C1917]">Datos que extrae el asistente: </span>
                            {(doc.campos_extraer || []).join(' · ')}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* SUB-PESTAÑA 3: CATEGORÍAS QUE MODIFICAN EL TRÁMITE Y LA MINUTA */}
                {tabConfig === 'CATEGORIAS' && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <form
                      onSubmit={guardarNuevaCategoria}
                      className="lg:col-span-5 bg-white p-6 rounded-xl border border-[#E6E4DD] space-y-4 h-fit"
                    >
                      <h3 className="serif-editorial text-base font-semibold text-[#1C1917]">
                        Crear Categoría del Trámite
                      </h3>
                      <div className="space-y-1">
                        <label className="text-xs text-[#78716C]">Nombre de la Categoría</label>
                        <input
                          type="text"
                          value={nuevaCatNombre}
                          onChange={(e) => setNuevaCatNombre(e.target.value)}
                          placeholder="Ej: Venta con Apoderado / Con Usufructo"
                          className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                        />
                      </div>
                      <div className="space-y-1">
                        <label className="text-xs text-[#78716C]">Pregunta que hace el Asistente</label>
                        <input
                          type="text"
                          value={nuevaCatPregunta}
                          onChange={(e) => setNuevaCatPregunta(e.target.value)}
                          placeholder="Ej: ¿Alguno de los otorgantes firma mediante apoderado?"
                          className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                        />
                      </div>
                      <div className="space-y-1">
                        <label className="text-xs text-[#78716C]">Documento adicional exigido</label>
                        <input
                          type="text"
                          value={nuevaCatDocExtra}
                          onChange={(e) => setNuevaCatDocExtra(e.target.value)}
                          placeholder="Ej: Poder Especial Autenticado"
                          className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                        />
                      </div>
                      <div className="space-y-1">
                        <label className="text-xs text-[#78716C]">Cambio que genera en la Escritura</label>
                        <input
                          type="text"
                          value={nuevaCatClausula}
                          onChange={(e) => setNuevaCatClausula(e.target.value)}
                          placeholder="Ej: Agrega cláusula de representación y protocoliza vigencia del poder"
                          className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                        />
                      </div>
                      <button
                        type="submit"
                        className="w-full py-2.5 rounded-lg bg-[#1C1917] text-white text-xs font-medium hover:bg-black/85"
                      >
                        Guardar Categoría
                      </button>
                    </form>

                    <div className="lg:col-span-7 space-y-3">
                      <h3 className="text-xs font-semibold uppercase tracking-wider text-[#78716C]">
                        Categorías Configuradas para: {tramiteConfig.nombre}
                      </h3>
                      {tramiteConfig.categorias.map((c) => (
                        <div key={c.categoria_id} className="p-5 rounded-xl border border-[#E6E4DD] bg-white space-y-1.5">
                          <h4 className="text-sm font-semibold text-[#1C1917]">{c.nombre}</h4>
                          <p className="text-xs text-[#78716C]">
                            <span className="font-medium text-[#1C1917]">Pregunta del asistente:</span> "{c.pregunta_agente}"
                          </p>
                          <p className="text-xs text-[#78716C]">
                            <span className="font-medium text-[#1C1917]">Efecto en la minuta:</span> {c.impacto_minuta}
                          </p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* SUB-PESTAÑA 4: CONFIGURACIÓN Y GESTIÓN DE PROYECTOS DE CONSTRUCTORAS */}
                {tabConfig === 'PROYECTOS' && (
                  <div className="space-y-6">
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                      {/* Formulario de creación de proyecto */}
                      <form
                        onSubmit={crearProyectoConstructora}
                        className="lg:col-span-4 bg-white p-6 rounded-xl border border-[#E6E4DD] space-y-4 h-fit"
                      >
                        <h3 className="serif-editorial text-base font-semibold text-[#1C1917]">
                          Crear Proyecto de Constructora
                        </h3>
                        <div className="space-y-1">
                          <label className="text-xs text-[#78716C]">Nombre del Proyecto Inmobiliario</label>
                          <input
                            type="text"
                            value={nuevoProyNombre}
                            onChange={(e) => setNuevoProyNombre(e.target.value)}
                            placeholder="Ej: Reserva del Parque P.H."
                            className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                          />
                        </div>
                        <div className="space-y-1">
                          <label className="text-xs text-[#78716C]">Nombre de la Constructora</label>
                          <input
                            type="text"
                            value={nuevoProyConstructora}
                            onChange={(e) => setNuevoProyConstructora(e.target.value)}
                            placeholder="Ej: Constructora Bolívar S.A."
                            className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                          />
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                          <div className="space-y-1">
                            <label className="text-xs text-[#78716C]">Número de Torres/Bloques</label>
                            <input
                              type="number"
                              min="1"
                              max="6"
                              value={nuevoProyBloques}
                              onChange={(e) => setNuevoProyBloques(e.target.value)}
                              className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                            />
                          </div>
                          <div className="space-y-1">
                            <label className="text-xs text-[#78716C]">Apartamentos por Bloque</label>
                            <input
                              type="number"
                              min="1"
                              max="12"
                              value={nuevoProyAptos}
                              onChange={(e) => setNuevoProyAptos(e.target.value)}
                              className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                            />
                          </div>
                        </div>
                        <button
                          type="submit"
                          className="w-full py-2.5 rounded-lg bg-[#1C1917] text-white text-xs font-medium hover:bg-black/85"
                        >
                          Crear Proyecto y Generar Unidades
                        </button>
                      </form>

                      {/* Matriz de Unidades del Proyecto */}
                      <div className="lg:col-span-8 bg-white p-6 rounded-xl border border-[#E6E4DD] space-y-5">
                        <div className="flex flex-wrap items-center justify-between gap-3 border-b border-[#E6E4DD] pb-4">
                          <div>
                            <h3 className="serif-editorial text-lg font-semibold text-[#1C1917]">
                              {proyecto.nombre_proyecto}
                            </h3>
                            <p className="text-xs text-[#78716C]">
                              {proyecto.constructora} · NIT {proyecto.nit}
                            </p>
                          </div>
                          <div className="flex flex-wrap gap-1.5">
                            {data.proyectos_constructoras.map((p, idx) => (
                              <button
                                key={p.proyecto_id}
                                onClick={() => {
                                  setProyectoIdx(idx);
                                  setUnidadSeleccionada(null);
                                }}
                                className={`px-3 py-1.5 rounded-lg text-xs font-medium border ${
                                  proyectoIdx === idx
                                    ? 'bg-[#1C1917] text-white border-[#1C1917]'
                                    : 'bg-[#F7F6F2] text-[#78716C] border-[#E6E4DD]'
                                }`}
                              >
                                {p.nombre_proyecto}
                              </button>
                            ))}
                          </div>
                        </div>

                        {/* Grilla limpia por Torre/Bloque */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                          {proyecto.bloques_configurados.map((bloque) => (
                            <div key={bloque} className="p-4 rounded-xl bg-[#F7F6F2] border border-[#E6E4DD] space-y-2.5">
                              <div className="text-xs font-semibold text-[#1C1917] border-b border-[#E6E4DD] pb-1.5">
                                {bloque}
                              </div>
                              <div className="grid grid-cols-2 gap-2">
                                {proyecto.unidades
                                  .filter((u) => u.bloque === bloque)
                                  .map((u) => (
                                    <button
                                      key={u.unidad_id}
                                      onClick={() => setUnidadSeleccionada(u)}
                                      className={`p-2.5 rounded-lg border text-left transition bg-white ${
                                        unidadSeleccionada?.unidad_id === u.unidad_id
                                          ? 'border-[#1C1917] ring-1 ring-[#1C1917]'
                                          : 'border-[#E6E4DD] hover:border-[#78716C]'
                                      }`}
                                    >
                                      <div className="flex items-center justify-between">
                                        <span className="mono-data text-xs font-semibold text-[#1C1917]">
                                          {u.unidad_id}
                                        </span>
                                        <span
                                          className={`w-2 h-2 rounded-full ${
                                            u.minuta_firmada
                                              ? 'bg-[#15803D]'
                                              : u.tiene_alerta_vencimiento
                                              ? 'bg-[#B45309]'
                                              : 'bg-[#D6D3CD]'
                                          }`}
                                        />
                                      </div>
                                      <div className="text-[10px] text-[#78716C] truncate mt-1">
                                        {u.estado_dinamico}
                                      </div>
                                    </button>
                                  ))}
                              </div>
                            </div>
                          ))}
                        </div>

                        {/* Detalle de la unidad seleccionada */}
                        {unidadSeleccionada && (
                          <div className="p-4 rounded-xl bg-[#FAF9F6] border border-[#E6E4DD] flex flex-wrap items-center justify-between gap-4">
                            <div className="space-y-1 text-xs">
                              <div className="font-semibold text-[#1C1917]">
                                Unidad {unidadSeleccionada.unidad_id} · {unidadSeleccionada.comprador_nombre || 'Sin comprador asignado'}
                              </div>
                              <div className="text-[#78716C]">
                                Valor: ${Number(unidadSeleccionada.valor_venta || 0).toLocaleString('es-CO')} · Área: {Number(unidadSeleccionada.area_m2 || 0)} m² · Documentos: {unidadSeleccionada.documentos_recibidos}/{unidadSeleccionada.documentos_totales}
                              </div>
                            </div>
                            <div className="flex flex-wrap items-center gap-1.5">
                              {proyecto.estados_personalizados.map((est) => (
                                <button
                                  key={est}
                                  onClick={() => {
                                    cambiarEstadoUnidad(proyecto.proyecto_id, unidadSeleccionada.unidad_id, est);
                                    setUnidadSeleccionada({ ...unidadSeleccionada, estado_dinamico: est });
                                  }}
                                  className={`px-2.5 py-1 rounded-md text-[11px] border ${
                                    unidadSeleccionada.estado_dinamico === est
                                      ? 'bg-[#1C1917] text-white border-[#1C1917]'
                                      : 'bg-white text-[#78716C] border-[#E6E4DD]'
                                  }`}
                                >
                                  {est}
                                </button>
                              ))}
                              <button
                                onClick={() => setVistaActiva('ASISTENTE')}
                                className="px-3 py-1 rounded-md bg-[#1C1917] text-white text-[11px] font-medium ml-2"
                              >
                                Abrir en el Asistente →
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}
              </main>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
