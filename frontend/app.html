<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notaría 33 de Bogotá · Asistente Notarial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #F7F6F2;
        color: #1C1917;
        margin: 0;
        -webkit-font-smoothing: antialiased;
      }
      .serif-editorial {
        font-family: 'Playfair Display', Georgia, serif;
      }
      .mono-data {
        font-family: 'JetBrains Mono', monospace;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #D6D3CD;
        border-radius: 9999px;
      }
    </style>
  </head>
  <body class="bg-[#F7F6F2] text-[#1C1917]">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      function App() {
        // Todos los Hooks en el bloque superior (Prevención Error #310)
        const [data, setData] = useState(null);
        const [loading, setLoading] = useState(true);

        // Vistas:
        // 'CHAT_PURO' -> Solo se ve el chat en pantalla (cero botones sueltos)
        // 'FICHA_TRAMITE' -> Se oculta el chat y se ve toda la ficha del trámite, documentos escaneados, predio y aprobaciones
        // 'CONFIGURACION' -> Donde se configuran trámites (con ID y subcategorías), documentos y proyectos de constructoras
        const [vistaActiva, setVistaActiva] = useState('CHAT_PURO');
        const [tabConfig, setTabConfig] = useState('TRAMITES');

        // Interacción en el Chat
        const [mensajeInput, setMensajeInput] = useState('');
        const [notificacion, setNotificacion] = useState('');

        // Documento seleccionado dentro de la Ficha del Trámite para ver su Imagen Escaneada y Corregir/Aprobar
        const [docSeleccionadoId, setDocSeleccionadoId] = useState('doc-6');
        const [camposEditablesDoc, setCamposEditablesDoc] = useState([]);

        // Estados de edición de Partes e Impresión en la Ficha
        const [hojasPapel, setHojasPapel] = useState('AA-4910201 a AA-4910206');
        const [numEscritura, setNumEscritura] = useState('3.418 de 2026');
        const [torreConstructoraInput, setTorreConstructoraInput] = useState('Torre A');
        const [aptoConstructoraInput, setAptoConstructoraInput] = useState('401');

        // Estados de Configuración -> 1. Nuevo Trámite con ID y Subcategorías
        const [tramiteIdxSelec, setTramiteIdxSelec] = useState(0);
        const [nuevoTramiteId, setNuevoTramiteId] = useState('');
        const [nuevoTramiteCodigoCorto, setNuevoTramiteCodigoCorto] = useState('');
        const [nuevoTramiteNombre, setNuevoTramiteNombre] = useState('');
        const [nuevoTramitePlantilla, setNuevoTramitePlantilla] = useState('VENTA PH.docx');
        const [reqDocs, setReqDocs] = useState(true);
        const [reqLinderos, setReqLinderos] = useState(true);
        const [reqAbogado, setReqAbogado] = useState(true);
        const [reqCliente, setReqCliente] = useState(true);

        // Estados de Configuración -> 2. Nuevo Documento
        const [nuevoDocNombre, setNuevoDocNombre] = useState('');
        const [nuevoDocRegla, setNuevoDocRegla] = useState('FIN_DE_MES_ACTUAL');
        const [nuevoDocCampos, setNuevoDocCampos] = useState('');
        const [nuevoDocDesc, setNuevoDocDesc] = useState('');

        // Estados de Configuración -> 3. Nueva Subcategoría
        const [nuevaCatId, setNuevaCatId] = useState('');
        const [nuevaCatNombre, setNuevaCatNombre] = useState('');
        const [nuevaCatPregunta, setNuevaCatPregunta] = useState('');
        const [nuevaCatDocExtra, setNuevaCatDocExtra] = useState('');
        const [nuevaCatClausula, setNuevaCatClausula] = useState('');

        // Estados de Configuración -> 4. Proyectos de Constructoras
        const [proyectoIdx, setProyectoIdx] = useState(0);
        const [unidadSeleccionada, setUnidadSeleccionada] = useState(null);
        const [nuevoProyNombre, setNuevoProyNombre] = useState('');
        const [nuevoProyConstructora, setNuevoProyConstructora] = useState('');
        const [nuevoProyNit, setNuevoProyNit] = useState('');
        const [nuevoProyBloques, setNuevoProyBloques] = useState(3);
        const [nuevoProyAptos, setNuevoProyAptos] = useState(6);

        const chatEndRef = useRef(null);

        const mostrarAviso = (txt) => {
          setNotificacion(txt);
          setTimeout(() => setNotificacion(''), 4000);
        };

        const cargarEstado = async () => {
          try {
            const res = await fetch('/api/state');
            const json = await res.json();
            setData(json);
            const c = json.caso_activo || json.casos?.[0];
            if (c?.aprobaciones) {
              setHojasPapel(c.aprobaciones.hojas_papel_notarial || 'AA-4910201 a AA-4910206');
              setNumEscritura(c.aprobaciones.numero_escritura_asignada || '3.418 de 2026');
            }
            if (c?.documentos?.length) {
              const actual = c.documentos.find((d) => d.id === docSeleccionadoId) || c.documentos[0];
              setDocSeleccionadoId(actual.id);
              setCamposEditablesDoc(actual.campos_leidos_agente || []);
            }
          } catch (e) {
            console.error(e);
          } finally {
            setLoading(false);
          }
        };

        useEffect(() => {
          cargarEstado();
        }, []);

        useEffect(() => {
          if (chatEndRef.current && vistaActiva === 'CHAT_PURO') {
            chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
          }
        }, [data?.caso_activo?.mensajes_chat?.length, vistaActiva]);

        const cambiarUsuario = async (usuario_id, puede_acceder_agente) => {
          const payload = { usuario_id };
          if (typeof puede_acceder_agente === 'boolean') {
            payload.puede_acceder_agente = puede_acceder_agente;
          }
          await fetch('/api/usuario/cambiar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          await cargarEstado();
          mostrarAviso('Perfil de usuario actualizado.');
        };

        const seleccionarCaso = async (caso_id, irAFicha = false) => {
          await fetch('/api/caso/seleccionar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ caso_id })
          });
          await cargarEstado();
          if (irAFicha) {
            setVistaActiva('FICHA_TRAMITE');
          } else {
            setVistaActiva('CHAT_PURO');
          }
        };

        const enviarInteraccionAgente = async (payload = {}) => {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const json = await res.json();
          setMensajeInput('');
          await cargarEstado();
          if (json.duplicado_bloqueado) {
            mostrarAviso('Trámite ya ABIERTO: el Agente bloqueó el duplicado y te llevó al trámite existente.');
          }
        };

        const seleccionarDocEnFicha = (doc) => {
          setDocSeleccionadoId(doc.id);
          setCamposEditablesDoc(JSON.parse(JSON.stringify(doc.campos_leidos_agente || [])));
        };

        const guardarYAprobarDocumento = async (documento_id, aprobar = true) => {
          await fetch('/api/documento/aprobar-o-corregir', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              documento_id,
              campos_actualizados: camposEditablesDoc,
              aprobar
            })
          });
          await cargarEstado();
          mostrarAviso(aprobar ? 'Documento verificado y aprobado por el abogado.' : 'Corrección guardada en el documento.');
        };

        const aprobarLindero = async (lindero_id, valor_aprobado, aprobar_todos = false) => {
          await fetch('/api/linderos/aprobar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lindero_id, valor_aprobado, aprobar_todos })
          });
          await cargarEstado();
          mostrarAviso('Linderos verificados sobre la imagen de la minuta anterior y aprobados.');
        };

        const avanzarFlujo = async (paso) => {
          await fetch('/api/flujo/avanzar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              paso,
              hojas_papel_notarial: hojasPapel,
              numero_escritura: numEscritura
            })
          });
          await cargarEstado();
          mostrarAviso('Estado de aprobación del trámite actualizado.');
        };

        const reiniciarTodo = async () => {
          await fetch('/api/caso/reiniciar', { method: 'POST' });
          setVistaActiva('CHAT_PURO');
          await cargarEstado();
          mostrarAviso('Sistema restaurado a los datos iniciales de demostración.');
        };

        const ejecutarAccionBotonChat = async (tipo) => {
          if (tipo === 'VER_FICHA_TRAMITE') {
            setVistaActiva('FICHA_TRAMITE');
          } else if (tipo === 'SUBIR_CEDULA_MONICA') {
            await enviarInteraccionAgente({
              subir_cedula_monica: true,
              mensaje: 'Adjunto en el chat la Cédula de Ciudadanía de Mónica Patricia Pérez Gómez (C.C. 52.110.900).'
            });
            mostrarAviso('Cédula de Mónica Pérez adjuntada en el chat.');
          } else if (tipo === 'VINCULAR_CONSTRUCTORA_CHAT') {
            await enviarInteraccionAgente({
              vincular_constructora: true,
              torre_bloque: torreConstructoraInput,
              apartamento: aptoConstructoraInput,
              mensaje: `Sí, este trámite pertenece al proyecto Torres del Parque Reservado P.H., ${torreConstructoraInput}, Apartamento ${aptoConstructoraInput}.`
            });
            mostrarAviso(`Vinculado a Constructora: ${torreConstructoraInput} · Apto ${aptoConstructoraInput}.`);
          } else if (tipo === 'CREAR_TRAMITE_NUEVO_CHIP') {
            await enviarInteraccionAgente({
              crear_tramite_desde_chat: true,
              forzar_nuevo_distinto: true,
              chip: 'AAA0299BCDE',
              apellido: 'RAMIREZ',
              nombre_propietario: 'CAMILO ANDRÉS RAMÍREZ SOTO',
              cedula: '80.554.321',
              matricula: '50N-9944112',
              mensaje: 'Adjunto Certificado de Libertad y Tradición matrícula 50N-9944112 (CHIP AAA0299BCDE) de Camilo Andrés Ramírez Soto (C.C. 80.554.321) para abrir nuevo trámite de Compraventa.'
            });
            mostrarAviso('Nuevo trámite COMPRAVENTA-AAA0299BCDE-RAMIREZ creado y abierto.');
          } else if (tipo === 'APROBAR_ABOGADO') {
            await avanzarFlujo('VISTO_BUENO_ABOGADO');
          } else if (tipo === 'APROBAR_CLIENTES') {
            await avanzarFlujo('VISTO_BUENO_CLIENTES');
          } else if (tipo === 'IMPRIMIR_ESCRITURA') {
            await avanzarFlujo('ENVIAR_A_IMPRESION');
          }
        };

        // Funciones de Configuración
        const guardarNuevoTramite = async (e) => {
          e.preventDefault();
          if (!nuevoTramiteNombre.trim()) return;
          await fetch('/api/nosql/tramite', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              tramite_id: nuevoTramiteId.trim() || undefined,
              codigo_corto: nuevoTramiteCodigoCorto.trim() || undefined,
              nombre: nuevoTramiteNombre,
              plantilla_base: nuevoTramitePlantilla,
              flujo_aprobacion: {
                exige_documentos_vigentes: reqDocs,
                exige_revision_linderos: reqLinderos,
                exige_aprobacion_abogado: reqAbogado,
                exige_aprobacion_cliente: reqCliente,
                exige_impresion_papel_notarial: true
              }
            })
          });
          setNuevoTramiteId('');
          setNuevoTramiteCodigoCorto('');
          setNuevoTramiteNombre('');
          setTramiteIdxSelec(0);
          await cargarEstado();
          mostrarAviso('Nuevo trámite con su código e ID guardado en el catálogo.');
        };

        const guardarNuevoDocumento = async (e) => {
          e.preventDefault();
          if (!nuevoDocNombre.trim()) return;
          await fetch('/api/nosql/documento-regla', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              tramite_idx: tramiteIdxSelec,
              codigo: nuevoDocNombre.toUpperCase().replace(/\s+/g, '_'),
              nombre: nuevoDocNombre,
              regla_vencimiento: nuevoDocRegla,
              campos_extraer: nuevoDocCampos
                ? nuevoDocCampos.split(',').map((s) => s.trim())
                : ['Fecha de expedición', 'Titular'],
              descripcion_regla: nuevoDocDesc || 'Regla de verificación configurada por la notaría.'
            })
          });
          setNuevoDocNombre('');
          setNuevoDocCampos('');
          setNuevoDocDesc('');
          await cargarEstado();
          mostrarAviso('Documento agregado al trámite.');
        };

        const guardarNuevaCategoria = async (e) => {
          e.preventDefault();
          if (!nuevaCatNombre.trim()) return;
          await fetch('/api/nosql/categoria', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              tramite_idx: tramiteIdxSelec,
              categoria_id: nuevaCatId.trim() || 'SUB-' + nuevaCatNombre.toUpperCase().replace(/\s+/g, '_').slice(0, 12),
              nombre: nuevaCatNombre,
              pregunta_agente: nuevaCatPregunta || '¿Aplica esta subcategoría al trámite?',
              documentos_adicionales: nuevaCatDocExtra ? [nuevaCatDocExtra] : [],
              clausulas_afectadas: [nuevaCatClausula || 'Cláusula especial del acto'],
              impacto_minuta: nuevaCatClausula || 'Ajusta el texto de la minuta según la subcategoría.'
            })
          });
          setNuevaCatId('');
          setNuevaCatNombre('');
          setNuevaCatPregunta('');
          setNuevaCatDocExtra('');
          setNuevaCatClausula('');
          await cargarEstado();
          mostrarAviso('Subcategoría agregada al trámite.');
        };

        const crearProyectoConstructora = async (e) => {
          e.preventDefault();
          if (!nuevoProyNombre.trim()) return;
          await fetch('/api/constructoras/crear-proyecto', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              nombre_proyecto: nuevoProyNombre,
              constructora: nuevoProyConstructora || 'Constructora Aliada S.A.',
              nit: nuevoProyNit || '900.412.889-1',
              num_bloques: Number(nuevoProyBloques || 3),
              aptos_por_bloque: Number(nuevoProyAptos || 6)
            })
          });
          setNuevoProyNombre('');
          setNuevoProyConstructora('');
          setNuevoProyNit('');
          setProyectoIdx(0);
          await cargarEstado();
          mostrarAviso('Proyecto de constructora creado con sus torres y apartamentos.');
        };

        const cambiarEstadoUnidad = async (proyecto_id, unidad_id, nuevo_estado) => {
          await fetch('/api/constructoras/actualizar-unidad', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ proyecto_id, unidad_id, nuevo_estado })
          });
          await cargarEstado();
          mostrarAviso(`Apartamento ${unidad_id} actualizado a "${nuevo_estado}".`);
        };

        if (loading || !data) {
          return (
            <div className="min-h-screen flex items-center justify-center bg-[#F7F6F2] text-[#1C1917]">
              <div className="text-center space-y-2">
                <p className="serif-editorial text-xl">Notaría 33 de Bogotá</p>
                <p className="text-xs text-[#78716C]">Cargando asistente y archivo de trámites...</p>
              </div>
            </div>
          );
        }

        const caso = data.caso_activo || data.casos[0];
        const usuarioActivo = data.usuario_activo || data.usuarios_temporales[2];
        const tramiteConfig = data.catalogo_tramites[tramiteIdxSelec] || data.catalogo_tramites[0];
        const proyecto = data.proyectos_constructoras[proyectoIdx] || data.proyectos_constructoras[0];
        const liq = data.liquidacion_actual;
        const estadoBpmn = data.estado_bpmn;
        const docActual = caso.documentos.find((d) => d.id === docSeleccionadoId) || caso.documentos[0];
        const cert = caso.certificado_tradicion || {};

        const traducirVigencia = (codigoRegla) => {
          if (codigoRegla === 'FIN_DE_MES_ACTUAL') return 'Vence el último día del mes en curso (Alerta a 5 días)';
          if (codigoRegla === 'MAX_30_DIAS') return 'Máximo 30 días desde expedición';
          if (codigoRegla === 'MAX_90_DIAS') return 'Máximo 90 días (3 meses)';
          return 'Permanente · Sin vencimiento';
        };

        return (
          <div className="min-h-screen flex flex-col bg-[#F7F6F2] text-[#1C1917]">
            {/* =====================================================================
                BARRA SUPERIOR MINIMALISTA LOFT (Con Selector de Perfil Temporal y Acceso al Agente)
               ===================================================================== */}
            <header className="bg-[#F7F6F2] border-b border-[#E6E4DD] px-6 py-3 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-30">
              <div className="flex items-center gap-3.5">
                <div className="w-8 h-8 rounded-lg bg-[#1C1917] text-white flex items-center justify-center serif-editorial font-semibold text-sm">
                  N33
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="serif-editorial text-base font-semibold text-[#1C1917]">
                      Notaría 33 de Bogotá
                    </h1>
                    <span className="text-xs text-[#78716C]">·</span>
                    <span className="mono-data text-xs font-medium text-[#1C1917]">
                      {caso.codigo_tramite}
                    </span>
                    <span
                      className={`px-2 py-0.5 rounded text-[10px] font-semibold ${
                        caso.estado_apertura === 'ABIERTO'
                          ? 'bg-[#F0FDF4] text-[#15803D] border border-[#BBF7D0]'
                          : 'bg-[#F0EFEA] text-[#78716C] border border-[#E6E4DD]'
                      }`}
                    >
                      {caso.estado_apertura}
                    </span>
                  </div>
                  <p className="text-[11px] text-[#78716C]">{caso.titulo_tramite}</p>
                </div>
              </div>

              {notificacion && (
                <div className="px-3.5 py-1.5 rounded-lg bg-[#1C1917] text-white text-xs font-medium">
                  {notificacion}
                </div>
              )}

              {/* SELECTOR DE PERFIL TEMPORAL (Abogado que Carga, Abogado Verificador, Integral, Cliente) + Toggle "¿Tiene acceso al Agente?" */}
              <div className="flex flex-wrap items-center gap-3">
                <div className="flex items-center gap-2 bg-white px-3 py-1.5 rounded-xl border border-[#E6E4DD] text-xs">
                  <span className="text-[#78716C]">Perfil activo:</span>
                  <select
                    value={usuarioActivo.usuario_id}
                    onChange={(e) => cambiarUsuario(e.target.value)}
                    className="bg-transparent font-medium text-[#1C1917] focus:outline-none"
                  >
                    {data.usuarios_temporales.map((u) => (
                      <option key={u.usuario_id} value={u.usuario_id}>
                        {u.nombre} — {u.cargo}
                      </option>
                    ))}
                  </select>
                  {usuarioActivo.rol_codigo === 'ABOGADO_VERIFICADOR' && (
                    <label className="flex items-center gap-1.5 pl-2 border-l border-[#E6E4DD] text-[11px] text-[#78716C] cursor-pointer">
                      <input
                        type="checkbox"
                        checked={usuarioActivo.permisos.puede_acceder_agente}
                        onChange={(e) => cambiarUsuario(usuarioActivo.usuario_id, e.target.checked)}
                      />
                      <span>¿Aprueba con acceso al Agente? ({usuarioActivo.permisos.puede_acceder_agente ? 'Sí' : 'No, solo Ficha'})</span>
                    </label>
                  )}
                </div>

                {/* Navegación limpia */}
                <div className="flex items-center gap-1.5 bg-[#F0EFEA] p-1 rounded-xl border border-[#E6E4DD]">
                  <button
                    onClick={() => setVistaActiva('CHAT_PURO')}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-medium transition ${
                      vistaActiva === 'CHAT_PURO'
                        ? 'bg-[#1C1917] text-white'
                        : 'text-[#78716C] hover:text-[#1C1917]'
                    }`}
                  >
                    Chat del Agente
                  </button>
                  <button
                    onClick={() => setVistaActiva('FICHA_TRAMITE')}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-medium transition ${
                      vistaActiva === 'FICHA_TRAMITE'
                        ? 'bg-[#1C1917] text-white'
                        : 'text-[#78716C] hover:text-[#1C1917]'
                    }`}
                  >
                    Ver Trámite ({caso.documentos.length} docs)
                  </button>
                  <button
                    onClick={() => setVistaActiva('CONFIGURACION')}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-medium transition ${
                      vistaActiva === 'CONFIGURACION'
                        ? 'bg-[#1C1917] text-white'
                        : 'text-[#78716C] hover:text-[#1C1917]'
                    }`}
                  >
                    Configuración
                  </button>
                </div>
              </div>
            </header>

            {/* =====================================================================
                VISTA 1: PANTALLA 100% SOLO EL CHAT (CERO PANELES LATERALES)
                Desde aquí se busca por cédula/CHIP/nombre, se adjuntan documentos,
                se abre un trámite con el Certificado de Tradición (validando duplicados)
                y al decir "Ver Trámite" se oculta el chat.
               ===================================================================== */}
            {vistaActiva === 'CHAT_PURO' && (
              <main className="flex-1 max-w-4xl w-full mx-auto px-6 py-6 flex flex-col h-[calc(100vh-76px)]">
                {!usuarioActivo.permisos.puede_acceder_agente ? (
                  <div className="bg-white rounded-xl border border-[#E6E4DD] p-8 text-center space-y-4 my-auto">

                      </div>
                    </div>

                    <div className="pt-2 border-t border-[#E6E4DD] space-y-2">
                      <div className="text-xs font-semibold text-[#1C1917]">Historial de lo que aprobó el Abogado:</div>
                      <div className="space-y-2 max-h-56 overflow-y-auto">
                        {(caso.bitacora || []).map((b) => (
                          <div key={b.id} className="p-2.5 rounded-lg bg-[#FAF9F6] border border-[#E6E4DD] text-[11px]">
                            <div className="font-semibold text-[#1C1917]">{b.etapa} · {b.actor}</div>
                            <div className="text-[#78716C]">{b.detalle}</div>
                            <div className="mono-data text-[10px] text-[#78716C] mt-0.5">{b.fecha}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              </main>
            )}

            {/* =====================================================================
                VISTA 3: CONFIGURACIÓN (MÚLTIPLES TRÁMITES CON CÓDIGO/ID, SUBCATEGORÍAS, DOCUMENTOS Y PROYECTOS DE CONSTRUCTORAS)
               ===================================================================== */}
            {vistaActiva === 'CONFIGURACION' && (
              <main className="flex-1 max-w-6xl w-full mx-auto px-6 py-8 space-y-6">
                <div className="flex flex-wrap items-center justify-between gap-4 border-b border-[#E6E4DD] pb-5">
                  <div>
                    <h2 className="serif-editorial text-2xl font-semibold text-[#1C1917]">
                      Configuración de Trámites, Subcategorías, Documentos y Constructoras
                    </h2>
                    <p className="text-xs text-[#78716C] mt-1">
                      Configura todos los trámites de la notaría con su Código/ID único, sus múltiples subcategorías, las reglas de vencimiento de documentos y los proyectos inmobiliarios.
                    </p>
                  </div>

                  <div className="flex flex-wrap gap-1.5 bg-[#F0EFEA] p-1 rounded-xl border border-[#E6E4DD]">
                    <button
                      onClick={() => setTabConfig('TRAMITES')}
                      className={`px-3.5 py-1.5 rounded-lg text-xs font-medium transition ${
                        tabConfig === 'TRAMITES' ? 'bg-[#1C1917] text-white' : 'text-[#78716C]'
                      }`}
                    >
                      1. Trámites con Código/ID ({data.catalogo_tramites.length})
                    </button>
                    <button
                      onClick={() => setTabConfig('CATEGORIAS')}
                      className={`px-3.5 py-1.5 rounded-lg text-xs font-medium transition ${
                        tabConfig === 'CATEGORIAS' ? 'bg-[#1C1917] text-white' : 'text-[#78716C]'
                      }`}
                    >
                      2. Subcategorías del Trámite ({tramiteConfig.categorias.length})
                    </button>
                    <button
                      onClick={() => setTabConfig('DOCUMENTOS')}
                      className={`px-3.5 py-1.5 rounded-lg text-xs font-medium transition ${
                        tabConfig === 'DOCUMENTOS' ? 'bg-[#1C1917] text-white' : 'text-[#78716C]'
                      }`}
                    >
                      3. Documentos y Vigencias ({tramiteConfig.documentos_reglas.length})
                    </button>
                    <button
                      onClick={() => setTabConfig('PROYECTOS')}
                      className={`px-3.5 py-1.5 rounded-lg text-xs font-medium transition ${
                        tabConfig === 'PROYECTOS' ? 'bg-[#1C1917] text-white' : 'text-[#78716C]'
                      }`}
                    >
                      4. Proyectos de Constructoras ({data.proyectos_constructoras.length})
                    </button>
                  </div>
                </div>

                {/* 1. TRÁMITES CON ID Y CÓDIGO */}
                {tabConfig === 'TRAMITES' && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <form
                      onSubmit={guardarNuevoTramite}
                      className="lg:col-span-5 bg-white p-6 rounded-xl border border-[#E6E4DD] space-y-4 h-fit"
                    >
                      <h3 className="serif-editorial text-base font-semibold text-[#1C1917]">
                        Crear Nuevo Trámite Notarial
                      </h3>
                      <div className="grid grid-cols-2 gap-3">
                        <div className="space-y-1">
                          <label className="text-xs text-[#78716C]">Código / ID del Trámite</label>
                          <input
                            type="text"
                            value={nuevoTramiteId}
                            onChange={(e) => setNuevoTramiteId(e.target.value)}
                            placeholder="Ej: TRM-05-DONACION"
                            className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs mono-data"
                          />
                        </div>
                        <div className="space-y-1">
                          <label className="text-xs text-[#78716C]">Prefijo de Codificación</label>
                          <input
                            type="text"
                            value={nuevoTramiteCodigoCorto}
                            onChange={(e) => setNuevoTramiteCodigoCorto(e.target.value)}
                            placeholder="Ej: DONACION"
                            className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs mono-data"
                          />
                        </div>
                      </div>
                      <div className="space-y-1">
                        <label className="text-xs text-[#78716C]">Nombre del Trámite</label>
                        <input
                          type="text"
                          value={nuevoTramiteNombre}
                          onChange={(e) => setNuevoTramiteNombre(e.target.value)}
                          placeholder="Ej: Escritura Pública de Donación e Insinuación"
                          className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                        />
                      </div>
                      <div className="space-y-1">
                        <label className="text-xs text-[#78716C]">Plantilla Base (.docx)</label>
                        <input
                          type="text"
                          value={nuevoTramitePlantilla}
                          onChange={(e) => setNuevoTramitePlantilla(e.target.value)}
                          className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                        />
                      </div>
                      <button
                        type="submit"
                        className="w-full py-2.5 rounded-lg bg-[#1C1917] text-white text-xs font-medium"
                      >
                        Guardar Trámite en el Catálogo
                      </button>
                    </form>

                    <div className="lg:col-span-7 space-y-3">
                      <h3 className="text-xs font-semibold uppercase tracking-wider text-[#78716C]">
                        Catálogo de Trámites de la Notaría (Haz clic en uno para editar sus subcategorías y documentos)
                      </h3>
                      {data.catalogo_tramites.map((t, idx) => (
                        <div
                          key={t.tramite_id}
                          onClick={() => setTramiteIdxSelec(idx)}
                          className={`p-5 rounded-xl border transition cursor-pointer bg-white ${
                            tramiteIdxSelec === idx ? 'border-[#1C1917] ring-1 ring-[#1C1917]' : 'border-[#E6E4DD]'
                          }`}
                        >
                          <div className="flex items-center justify-between">
                            <div>
                              <div className="flex items-center gap-2">
                                <span className="mono-data text-xs font-semibold px-2 py-0.5 rounded bg-[#F7F6F2] border border-[#E6E4DD]">
                                  ID: {t.tramite_id}
                                </span>
                                <span className="mono-data text-[11px] text-[#78716C]">
                                  Formato código: {t.codigo_corto || 'TRAMITE'}-[CHIP]-[APELLIDO]
                                </span>
                              </div>
                              <h4 className="text-sm font-semibold text-[#1C1917] mt-1">{t.nombre}</h4>
                              <p className="text-xs text-[#78716C]">Plantilla: {t.plantilla_base}</p>
                            </div>
                            <div className="text-right text-xs text-[#78716C]">
                              <div>{t.categorias.length} subcategorías</div>
                              <div>{t.documentos_reglas.length} documentos</div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 2. SUBCATEGORÍAS DEL TRÁMITE */}
                {tabConfig === 'CATEGORIAS' && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <form
                      onSubmit={guardarNuevaCategoria}
                      className="lg:col-span-5 bg-white p-6 rounded-xl border border-[#E6E4DD] space-y-4 h-fit"
                    >
                      <h3 className="serif-editorial text-base font-semibold text-[#1C1917]">
                        Agregar Subcategoría a: {tramiteConfig.nombre}
                      </h3>
                      <div className="space-y-1">
                        <label className="text-xs text-[#78716C]">Código de Subcategoría</label>
                        <input
                          type="text"
                          value={nuevaCatId}
                          onChange={(e) => setNuevaCatId(e.target.value)}
                          placeholder="Ej: SUB-CON-APODERADO"
                          className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs mono-data"
                        />
                      </div>
                      <div className="space-y-1">
                        <label className="text-xs text-[#78716C]">Nombre de la Subcategoría</label>
                        <input
                          type="text"
                          value={nuevaCatNombre}
                          onChange={(e) => setNuevaCatNombre(e.target.value)}
                          placeholder="Ej: Firma con Apoderado Especial"
                          className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                        />
                      </div>
                      <div className="space-y-1">
                        <label className="text-xs text-[#78716C]">Pregunta que hace el Agente</label>
                        <input
                          type="text"
                          value={nuevaCatPregunta}
                          onChange={(e) => setNuevaCatPregunta(e.target.value)}
                          placeholder="Ej: ¿Alguno de los otorgantes actúa mediante poder?"
                          className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                        />
                      </div>
                      <div className="space-y-1">
                        <label className="text-xs text-[#78716C]">Efecto en la Minuta</label>
                        <input
                          type="text"
                          value={nuevaCatClausula}
                          onChange={(e) => setNuevaCatClausula(e.target.value)}
                          placeholder="Ej: Inserta cláusula de apoderado y vigencia del poder"
                          className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                        />
                      </div>
                      <button
                        type="submit"
                        className="w-full py-2.5 rounded-lg bg-[#1C1917] text-white text-xs font-medium"
                      >
                        Guardar Subcategoría
                      </button>
                    </form>

                    <div className="lg:col-span-7 space-y-3">
                      <h3 className="text-xs font-semibold uppercase tracking-wider text-[#78716C]">
                        Subcategorías de {tramiteConfig.nombre} ({tramiteConfig.tramite_id})
                      </h3>
                      {tramiteConfig.categorias.map((c) => (
                        <div key={c.categoria_id} className="p-5 rounded-xl border border-[#E6E4DD] bg-white space-y-1.5">
                          <div className="flex items-center gap-2">
                            <span className="mono-data text-[11px] px-2 py-0.5 rounded bg-[#F7F6F2] border border-[#E6E4DD]">
                              {c.categoria_id}
                            </span>
                            <h4 className="text-sm font-semibold text-[#1C1917]">{c.nombre}</h4>
                          </div>
                          <p className="text-xs text-[#78716C]">
                            <strong>Pregunta del Agente:</strong> "{c.pregunta_agente}"
                          </p>
                          <p className="text-xs text-[#78716C]">
                            <strong>Cambio en Minuta:</strong> {c.impacto_minuta}
                          </p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 3. DOCUMENTOS Y VIGENCIAS */}
                {tabConfig === 'DOCUMENTOS' && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <form
                      onSubmit={guardarNuevoDocumento}
                      className="lg:col-span-5 bg-white p-6 rounded-xl border border-[#E6E4DD] space-y-4 h-fit"
                    >
                      <h3 className="serif-editorial text-base font-semibold text-[#1C1917]">
                        Agregar Documento a: {tramiteConfig.nombre}
                      </h3>
                      <div className="space-y-1">
                        <label className="text-xs text-[#78716C]">Nombre del Documento</label>
                        <input
                          type="text"
                          value={nuevoDocNombre}
                          onChange={(e) => setNuevoDocNombre(e.target.value)}
                          placeholder="Ej: Paz y Salvo de Administración"
                          className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                        />
                      </div>
                      <div className="space-y-1">
                        <label className="text-xs text-[#78716C]">Regla de Vencimiento</label>
                        <select
                          value={nuevoDocRegla}
                          onChange={(e) => setNuevoDocRegla(e.target.value)}
                          className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs bg-white"
                        >
                          <option value="FIN_DE_MES_ACTUAL">Vence el último día del mes (Alerta a 5 días)</option>
                          <option value="MAX_30_DIAS">Vigencia máxima de 30 días</option>
                          <option value="MAX_90_DIAS">Vigencia máxima de 90 días (3 meses)</option>
                          <option value="SIN_VENCIMIENTO">Permanente · Sin vencimiento</option>
                        </select>
                      </div>
                      <div className="space-y-1">
                        <label className="text-xs text-[#78716C]">Datos a extraer (separados por coma)</label>
                        <input
                          type="text"
                          value={nuevoDocCampos}
                          onChange={(e) => setNuevoDocCampos(e.target.value)}
                          placeholder="Ej: Nombre, Cédula, Fecha de expedición"
                          className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                        />
                      </div>
                      <button
                        type="submit"
                        className="w-full py-2.5 rounded-lg bg-[#1C1917] text-white text-xs font-medium"
                      >
                        Guardar Documento
                      </button>
                    </form>

                    <div className="lg:col-span-7 space-y-3">
                      <h3 className="text-xs font-semibold uppercase tracking-wider text-[#78716C]">
                        Documentos configurados para {tramiteConfig.nombre}
                      </h3>
                      {tramiteConfig.documentos_reglas.map((doc) => (
                        <div key={doc.codigo} className="p-5 rounded-xl border border-[#E6E4DD] bg-white space-y-1.5">
                          <div className="flex items-center justify-between">
                            <h4 className="text-sm font-semibold text-[#1C1917]">{doc.nombre}</h4>
                            <span className="px-2.5 py-0.5 rounded bg-[#F7F6F2] border border-[#E6E4DD] text-[11px]">
                              {traducirVigencia(doc.regla_vencimiento)}
                            </span>
                          </div>
                          <p className="text-xs text-[#78716C]">{doc.descripcion_regla}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 4. PROYECTOS DE CONSTRUCTORAS */}
                {tabConfig === 'PROYECTOS' && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <form
                      onSubmit={crearProyectoConstructora}
                      className="lg:col-span-4 bg-white p-6 rounded-xl border border-[#E6E4DD] space-y-4 h-fit"
                    >
                      <h3 className="serif-editorial text-base font-semibold text-[#1C1917]">
                        Crear Proyecto de Constructora
                      </h3>
                      <div className="space-y-1">
                        <label className="text-xs text-[#78716C]">Nombre del Proyecto</label>
                        <input
                          type="text"
                          value={nuevoProyNombre}
                          onChange={(e) => setNuevoProyNombre(e.target.value)}
                          placeholder="Ej: Reserva del Parque P.H."
                          className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                        />
                      </div>
                      <div className="space-y-1">
                        <label className="text-xs text-[#78716C]">Constructora</label>
                        <input
                          type="text"
                          value={nuevoProyConstructora}
                          onChange={(e) => setNuevoProyConstructora(e.target.value)}
                          placeholder="Ej: Constructora Bolívar S.A."
                          className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div className="space-y-1">
                          <label className="text-xs text-[#78716C]">Torres/Bloques</label>
                          <input
                            type="number"
                            min="1"
                            max="6"
                            value={nuevoProyBloques}
                            onChange={(e) => setNuevoProyBloques(e.target.value)}
                            className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                          />
                        </div>
                        <div className="space-y-1">
                          <label className="text-xs text-[#78716C]">Aptos por Torre</label>
                          <input
                            type="number"
                            min="1"
                            max="12"
                            value={nuevoProyAptos}
                            onChange={(e) => setNuevoProyAptos(e.target.value)}
                            className="w-full border border-[#E6E4DD] rounded-lg px-3 py-2 text-xs"
                          />
                        </div>
                      </div>
                      <button
                        type="submit"
                        className="w-full py-2.5 rounded-lg bg-[#1C1917] text-white text-xs font-medium"
                      >
                        Crear Proyecto y Unidades
                      </button>
                    </form>

                    <div className="lg:col-span-8 bg-white p-6 rounded-xl border border-[#E6E4DD] space-y-4">
                      <div className="flex items-center justify-between border-b border-[#E6E4DD] pb-3">
                        <div>
                          <h3 className="serif-editorial text-lg font-semibold text-[#1C1917]">
                            {proyecto.nombre_proyecto}
                          </h3>
                          <p className="text-xs text-[#78716C]">{proyecto.constructora} · NIT {proyecto.nit}</p>
                        </div>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        {proyecto.bloques_configurados.map((bloque) => (
                          <div key={bloque} className="p-4 rounded-xl bg-[#F7F6F2] border border-[#E6E4DD] space-y-2">
                            <div className="text-xs font-semibold text-[#1C1917]">{bloque}</div>
                            <div className="grid grid-cols-2 gap-2">
                              {proyecto.unidades
                                .filter((u) => u.bloque === bloque)
                                .map((u) => (
                                  <button
                                    key={u.unidad_id}
                                    onClick={() => setUnidadSeleccionada(u)}
                                    className="p-2 rounded-lg bg-white border border-[#E6E4DD] text-left text-xs"
                                  >
                                    <div className="mono-data font-semibold">{u.unidad_id}</div>
                                    <div className="text-[10px] text-[#78716C] truncate">{u.estado_dinamico}</div>
                                  </button>
                                ))}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </main>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
